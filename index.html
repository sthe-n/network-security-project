<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Search - Find Textbooks</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1 class="logo">📚 Searchly</h1>
        </header>
        
        <main class="home-content">
            <h2 class="tagline">Search</h2>
            
            <form class="search-form" action="/search" method="GET">
                <input type="text" name="q" class="search-input" placeholder="Ask Me Anything..." required>
                <button type="submit" class="search-button">Search</button>
            </form>
            
            <div class="bookmarks">
                <span>Bookmarks:</span>
                <a href="/search?q=Computer Science">Gmail</a>
                <a href="/search?q=Mathematics">myLMS</a>
                <a href="/search?q=Physics">vossie.net</a>
                <a href="/search?q=Biology">Youtube</a>
            </div>
        </main>
        
        <footer>
            <p>This is an educational simulation for cybersecurity awareness</p>
        </footer>
    </div>
</body>
</html>
